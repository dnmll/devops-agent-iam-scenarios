role_under_test: installer_role_arn

probes:
  # ---- simulate: positive matrix ----
  - name: sim-create-agentspace
    kind: simulate
    action: aidevops:CreateAgentSpace
    resource: "arn:aws:aidevops:us-east-1:111122223333:agentspace/probe"
    expect: allowed
  - name: sim-passrole-to-aidevops
    kind: simulate
    action: iam:PassRole
    resource: "arn:aws:iam::111122223333:role/DevOpsAgentRole-agentspace"
    context:
      iam:PassedToService: aidevops.amazonaws.com
    expect: allowed
  - name: sim-create-slr
    kind: simulate
    action: iam:CreateServiceLinkedRole
    resource: "arn:aws:iam::111122223333:role/aws-service-role/aidevops.amazonaws.com/AWSServiceRoleForAIDevOps"
    context:
      iam:AWSServiceName: aidevops.amazonaws.com
    expect: allowed

  # ---- simulate: negative matrix (least-privilege proof) ----
  - name: sim-passrole-to-lambda-denied
    kind: simulate
    action: iam:PassRole
    resource: "arn:aws:iam::111122223333:role/DevOpsAgentRole-agentspace"
    context:
      iam:PassedToService: lambda.amazonaws.com
    expect: implicitDeny
  - name: sim-passrole-other-role-denied
    kind: simulate
    action: iam:PassRole
    resource: "arn:aws:iam::111122223333:role/SomeOtherRole"
    context:
      iam:PassedToService: aidevops.amazonaws.com
    expect: implicitDeny
  - name: sim-create-role-denied
    kind: simulate
    action: iam:CreateRole
    resource: "arn:aws:iam::111122223333:role/DevOpsAgentRole-new"
    expect: implicitDeny
  - name: sim-secretsmanager-denied
    kind: simulate
    action: secretsmanager:CreateSecret
    resource: "*"
    expect: implicitDeny
  - name: sim-kms-decrypt-denied
    kind: simulate
    action: kms:Decrypt
    resource: "*"
    expect: implicitDeny

  # ---- simulate: adjacent-privilege matrix (other personas/scenarios) ----
  # The installer manages Agent Spaces; asset authoring belongs to the asset personas.
  - name: sim-create-asset-denied
    kind: simulate
    action: aidevops:CreateAsset
    resource: "arn:aws:aidevops:us-east-1:111122223333:agentspace/probe"
    expect: implicitDeny
  # Access-token management is a separate persona (b3 / a4), not the installer.
  - name: sim-create-access-token-denied
    kind: simulate
    action: aidevops:CreateAccessToken
    resource: "arn:aws:aidevops:us-east-1:111122223333:agentspace/probe"
    expect: implicitDeny
  # Vended log delivery is scenario b7, not the installer.
  - name: sim-allow-vended-log-delivery-denied
    kind: simulate
    action: aidevops:AllowVendedLogDeliveryForResource
    resource: "arn:aws:aidevops:us-east-1:111122223333:agentspace/probe"
    expect: implicitDeny
  # The CloudWatch Logs half of log delivery is likewise scenario b7.
  - name: sim-logs-put-delivery-source-denied
    kind: simulate
    action: logs:PutDeliverySource
    resource: "*"
    expect: implicitDeny
  # Role lifecycle (create/delete) is scenario b1; b2 only passes pre-created roles.
  - name: sim-delete-role-denied
    kind: simulate
    action: iam:DeleteRole
    resource: "arn:aws:iam::111122223333:role/DevOpsAgentRole-agentspace"
    expect: implicitDeny
  # The SLR grant is pinned to aidevops.amazonaws.com — any other service principal denies.
  - name: sim-create-slr-for-lambda-denied
    kind: simulate
    action: iam:CreateServiceLinkedRole
    resource: "arn:aws:iam::111122223333:role/aws-service-role/aidevops.amazonaws.com/AWSServiceRoleForAIDevOps"
    context:
      iam:AWSServiceName: lambda.amazonaws.com
    expect: implicitDeny

  # ---- real: authoritative allow-path (assumes role_under_test) ----
  - name: real-list-agent-spaces
    kind: real
    # boto3/CLI service name is devops-agent; "aidevops" is only the IAM namespace
    service: devops-agent
    operation: list_agent_spaces
    params: {}
    expect: success
  - name: real-create-slr
    kind: real
    service: iam
    operation: create_service_linked_role
    params:
      AWSServiceName: aidevops.amazonaws.com
    tolerate: [InvalidInput]
    expect: success

  # ---- real: Agent Space lifecycle (create → associate → get → delete) ----
  # The space is named iamscn-* so the tag-scoped sweeper can reclaim it if the
  # delete probe below never runs (deploy/probe abort).
  - name: real-create-agent-space
    kind: real
    service: devops-agent
    operation: create_agent_space
    params:
      name: iamscn-b2-probe
      description: Probe-created Agent Space for the b2-installer scenario
    # agentSpaceId feeds every probe after this one via the ${...} stash.
    save_output_as: agent_space_id=agentSpace.agentSpaceId
    expect: success
  # CreateAgentSpace itself takes no role ARN: the Agent Space role is handed to
  # the service by AssociateService (configuration.aws.assumableRoleArn), which
  # is therefore where iam:PassRole is really exercised. The ARN comes from the
  # terraform-provisioned iamscn-b2-dar-agentspace role.
  - name: real-associate-aws-account
    kind: real
    service: devops-agent
    operation: associate_service
    params:
      agentSpaceId: ${agent_space_id}
      serviceId: aws
      configuration:
        aws:
          assumableRoleArn: ${tf_output:agentspace_target_role_arn}
          accountId: "111122223333"
          accountType: monitor
    # These are service-side validation verdicts on the passed role, not IAM
    # authorization verdicts: the probe's job is to prove the installer policy
    # allows the call, so AccessDeniedException (and only that) must fail it.
    tolerate: [ValidationException, InvalidParameterException, ConflictException]
    expect: success
  - name: real-get-agent-space
    kind: real
    service: devops-agent
    operation: get_agent_space
    params:
      agentSpaceId: ${agent_space_id}
    expect: success
  - name: real-delete-agent-space
    kind: real
    service: devops-agent
    operation: delete_agent_space
    params:
      agentSpaceId: ${agent_space_id}
    # Idempotency on retry: a delete that succeeded but was retried (or a space
    # still settling) must not fail the run — only AccessDeniedException does.
    tolerate: [ResourceNotFoundException, ConflictException]
    expect: success
