role_under_test: registrar_role_arn

probes:
  # ---- simulate: positive matrix (the documented name prefix) ----
  - name: sim-create-secret-on-prefix
    kind: simulate
    action: secretsmanager:CreateSecret
    resource: "arn:aws:secretsmanager:us-east-1:111122223333:secret:devops-agent/dynatrace-oauth-AbCdEf"
    context:
      secretsmanager:Name: devops-agent/dynatrace-oauth
    expect: allowed
  - name: sim-put-secret-value-on-prefix
    kind: simulate
    action: secretsmanager:PutSecretValue
    resource: "arn:aws:secretsmanager:us-east-1:111122223333:secret:devops-agent/dynatrace-oauth-AbCdEf"
    expect: allowed
  - name: sim-describe-secret-on-prefix
    kind: simulate
    action: secretsmanager:DescribeSecret
    resource: "arn:aws:secretsmanager:us-east-1:111122223333:secret:devops-agent/dynatrace-oauth-AbCdEf"
    expect: allowed
  - name: sim-tag-secret-on-prefix
    kind: simulate
    action: secretsmanager:TagResource
    resource: "arn:aws:secretsmanager:us-east-1:111122223333:secret:devops-agent/dynatrace-oauth-AbCdEf"
    expect: allowed
  - name: sim-list-secrets
    kind: simulate
    action: secretsmanager:ListSecrets
    resource: "*"
    expect: allowed

  # ---- simulate: negative matrix — secrets outside the prefix ----
  - name: sim-create-secret-other-name-denied
    kind: simulate
    action: secretsmanager:CreateSecret
    resource: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/rds/master-AbCdEf"
    context:
      secretsmanager:Name: prod/rds/master
    expect: implicitDeny
  # Even an in-prefix ARN denies when the requested Name is out of prefix: the
  # secretsmanager:Name condition, not just the ARN, gates CreateSecret (the ARN
  # does not exist yet at create time).
  - name: sim-create-secret-prefix-arn-other-name-denied
    kind: simulate
    action: secretsmanager:CreateSecret
    resource: "arn:aws:secretsmanager:us-east-1:111122223333:secret:devops-agent/dynatrace-oauth-AbCdEf"
    context:
      secretsmanager:Name: prod/rds/master
    expect: implicitDeny
  - name: sim-put-secret-value-other-name-denied
    kind: simulate
    action: secretsmanager:PutSecretValue
    resource: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/rds/master-AbCdEf"
    expect: implicitDeny
  - name: sim-describe-secret-other-name-denied
    kind: simulate
    action: secretsmanager:DescribeSecret
    resource: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/rds/master-AbCdEf"
    expect: implicitDeny
  - name: sim-tag-secret-other-name-denied
    kind: simulate
    action: secretsmanager:TagResource
    resource: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/rds/master-AbCdEf"
    expect: implicitDeny

  # ---- simulate: the registrar writes credentials, it never reads or
  # destroys them — even inside its own prefix ----
  - name: sim-get-secret-value-denied
    kind: simulate
    action: secretsmanager:GetSecretValue
    resource: "arn:aws:secretsmanager:us-east-1:111122223333:secret:devops-agent/dynatrace-oauth-AbCdEf"
    expect: implicitDeny
  - name: sim-delete-secret-denied
    kind: simulate
    action: secretsmanager:DeleteSecret
    resource: "arn:aws:secretsmanager:us-east-1:111122223333:secret:devops-agent/dynatrace-oauth-AbCdEf"
    expect: implicitDeny
  - name: sim-update-secret-denied
    kind: simulate
    action: secretsmanager:UpdateSecret
    resource: "arn:aws:secretsmanager:us-east-1:111122223333:secret:devops-agent/dynatrace-oauth-AbCdEf"
    expect: implicitDeny
  # Secret resource policies would let the holder re-grant reads to anyone.
  - name: sim-put-resource-policy-denied
    kind: simulate
    action: secretsmanager:PutResourcePolicy
    resource: "arn:aws:secretsmanager:us-east-1:111122223333:secret:devops-agent/dynatrace-oauth-AbCdEf"
    expect: implicitDeny

  # ---- simulate: adjacent-privilege matrix (other scenarios' personas) ----
  # Registering the integration with the service is scenario b2, not b4.
  - name: sim-register-service-denied
    kind: simulate
    action: aidevops:RegisterService
    resource: "*"
    expect: implicitDeny
  - name: sim-create-agentspace-denied
    kind: simulate
    action: aidevops:CreateAgentSpace
    resource: "arn:aws:aidevops:us-east-1:111122223333:agentspace/probe"
    expect: implicitDeny
  # The compounding b5 case: with a customer-managed key, the registrar also
  # needs kms:GenerateDataKey via secretsmanager. This policy alone does not
  # grant it, so the AWS-managed-key path is the only one that works here.
  - name: sim-kms-generate-data-key-denied
    kind: simulate
    action: kms:GenerateDataKey
    resource: "arn:aws:kms:us-east-1:111122223333:key/1234abcd-12ab-34cd-56ef-1234567890ab"
    context:
      kms:ViaService: secretsmanager.us-east-1.amazonaws.com
    expect: implicitDeny
