id: a5-service-linked-roles
plane: A
title: Service-linked roles — AWSServiceRoleForAIDevOps (metrics) + AWSServiceRoleForLogDelivery
description: >
  The two service-linked roles AWS DevOps Agent depends on, and the one grant
  that provisions them. AWSServiceRoleForAIDevOps is what the service uses to
  publish its vended metrics into the AWS/AIDevOps namespace; it is created
  automatically during Agent Space creation, so the identity running that call
  needs iam:CreateServiceLinkedRole for aidevops.amazonaws.com or the call fails
  with InvalidParameterException. AWSServiceRoleForLogDelivery is what the AWS
  log-delivery service assumes to write vended logs into an Amazon Data Firehose
  stream (Firehose has no resource policy, so the CloudWatch Logs / S3
  bucket-policy route is unavailable). One artifact grants both, in a single
  statement whose iam:AWSServiceName condition and two-ARN Resource list pin it
  to exactly these two service-linked roles — never a
  create-an-SLR-for-any-service primitive.
status: static
docs:
  - https://docs.aws.amazon.com/devopsagent/latest/userguide/configuring-integrations-and-knowledge-vended-logs-and-metrics.html
  - https://docs.aws.amazon.com/devopsagent/latest/userguide/aws-devops-agent-security-devops-agent-iam-permissions.html
artifacts:
  - policies/create-slr-policy.json
terraform_dir: terraform
probes: expected/probes.yaml
substitutions:
  "111122223333": "${account_id}"
  "us-east-1": "${region}"
required_conditions:
  # iam:AWSServiceName is the entire least-privilege story of this artifact:
  # without it, iam:CreateServiceLinkedRole creates a service-linked role for ANY
  # AWS service, each arriving with its own AWS-managed permissions. Two
  # assertions, one per service name — both are checked against the single
  # CreateDevOpsAgentServiceLinkedRoles statement, so dropping either value from
  # the condition list fails `python3 -m tools.checks`.
  #
  # Why one statement with a two-value condition list and not two statements:
  # check_required_conditions requires EVERY Allow statement matching the action
  # to carry the asserted value, so splitting the grant in two would make the two
  # assertions mutually exclusive (each statement would fail the other's rule).
  # The condition list + the two-ARN Resource list is exactly as tight — IAM
  # requires both to match, and neither SLR path is reachable with the other
  # service's name (see the cross-pairing deny probes).
  - artifact: policies/create-slr-policy.json
    action: iam:CreateServiceLinkedRole
    condition_key: iam:AWSServiceName
    expected: aidevops.amazonaws.com
  - artifact: policies/create-slr-policy.json
    action: iam:CreateServiceLinkedRole
    condition_key: iam:AWSServiceName
    expected: delivery.logs.amazonaws.com
forbidden_actions:
  # This artifact exists for exactly one grant. Creating a service-linked role is
  # not role administration: an SLR's trust policy and permissions are fixed by
  # AWS and cannot be edited, which is what makes the grant safe. Ordinary role
  # and policy CRUD is the pre-provisioner's (b1), passing roles to the service
  # is the installer's (b2).
  - iam:CreateRole
  - iam:DeleteRole
  - iam:AttachRolePolicy
  - iam:PutRolePolicy
  - iam:UpdateAssumeRolePolicy
  - iam:PutRolePermissionsBoundary
  - iam:DeleteRolePermissionsBoundary
  - iam:PassRole
  - iam:CreateUser
  - iam:CreateAccessKey
  # Deleting a service-linked role is never part of this deliverable: both SLRs
  # are account-wide singletons that other Agent Spaces and other deliveries
  # depend on (see README → "Never delete these").
  - iam:DeleteServiceLinkedRole
  # Agent Space lifecycle is b2, vended log delivery configuration is b7, and
  # nothing here touches the data planes those wire up.
  - aidevops:*
  - logs:PutDeliverySource
  - logs:PutDeliveryDestination
  - logs:CreateDelivery
  - firehose:PutRecord
  - firehose:PutRecordBatch
  - cloudwatch:PutMetricData
